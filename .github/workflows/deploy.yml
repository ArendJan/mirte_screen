name: Deploy new version

# Only deploy when a new tag is pushed
on: [push, pull_request]
          
# Must match the project() name in CMakeLists.txt
env:
    APP_NAME: mirte_screen
    
# Allow this workflow to write back to the repository
permissions:
    contents: write
    
# Build binary and send to releases
jobs:
    build-deploy:
        runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-22.04' || 'ubuntu-22.04-arm' }}
        strategy:
            matrix:
                    arch: [
                        amd64, 
                        arm64, 
                        # armhf
                        ]

        name: Build and deploy
        steps:
          - uses: actions/checkout@v7
            with:
              submodules: true
          - name: Setup Cpp
            uses: aminya/setup-cpp@v1
            with:
              compiler: llvm
              cmake: true
              ninja: false
              vcpkg: false
              conan: true
              ccache: true
              cppcheck: false
              clangtidy: false # instead of `true`, which chooses the default version, you can pass a specific version.
          # ...
          - name: Build
            run: |
              sudo apt install -y libboost-dev libboost-thread-dev libboost-system-dev libboost-chrono-dev
              export CMAKE_CXX_COMPILER_LAUNCHER=ccache
              cmake -B build .
              cd build
              make
  
          - name: Copy executable file
            run: |
              cp ./build/mirte_screen ./
              
          # - name: install nodejs
          #   run: |
          #       apt update
          #       apt install curl unzip -y
          #       curl -fsSL https://deb.nodesource.com/setup_20.x -o nodesource_setup.sh
          #       chmod +x nodesource_setup.sh
          #       ./nodesource_setup.sh
          #       apt-get install -y nodejs
          #       node -v
          - name: Put environment variable into the env context
            run: echo "app_name=$APP_NAME" >> $GITHUB_ENV
          - name: Archive production artifacts
            uses: actions/upload-artifact@v7
            with:
              name: $APP_NAME_${{ matrix.arch }}
              path: |
                mirte_screen
          - name: Push to release
            uses: softprops/action-gh-release@v3
            if: startsWith(github.ref, 'refs/tags/')
            with:
                files: |
                  Telemetrix4RpiPico.uf2
                  Telemetrix4RpiPico.elf
                generate_release_notes: true
